[project]
name = "vocab-study"
version = "0.1.0"
description = "A terminal-first, command-driven vocabulary study program with a pluggable spaced-repetition engine and swappable dictionaries."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Optional feature groups. Sizes shown to the user before install (see `dict install`).
wordnet = ["nltk>=3.8"]              # offline dictionary (~40 MB corpus download)
repl = ["prompt_toolkit>=3.0"]       # history + tab-completion for power users
embeddings = ["sentence-transformers>=2.2"]  # phase-2 semantic judge (~250 MB via torch)
gui = ["PySide6>=6.5"]               # standalone desktop app (Qt); ~100 MB

[project.scripts]
vocab = "vocab.__main__:main"

[project.gui-scripts]
vocab-gui = "vocab.gui.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vocab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
