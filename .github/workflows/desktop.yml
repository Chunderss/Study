name: Desktop tests and Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[desktop-build,test]"
      - name: Download offline test dictionary
        run: python -m nltk.downloader -q -d build/nltk_data wordnet
      - name: GUI and storage regressions
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          NLTK_DATA: ${{ github.workspace }}/build/nltk_data
        run: python -m pytest -q
      - name: Build portable desktop app
        run: python tools/build_desktop.py
      - name: Smoke test packaged desktop and offline dictionary
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          # Keep the home: the windowed exe has no stderr, so desktop.log is the only record.
          home = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vocab-smoke-home'
          home.mkdir(parents=True, exist_ok=True)
          # The smoke opens real EPUB/PDF readers; like the WebEngine tests, use
          # native Windows rendering rather than the offscreen platform.
          try:
              code = subprocess.run([r'dist\VocabStudy\VocabStudy.exe', '--home', str(home), '--smoke-test'],
                                    timeout=90, env={**os.environ, 'QT_QPA_PLATFORM': 'windows',
                                                     'QTWEBENGINE_CHROMIUM_FLAGS': '--disable-gpu'}).returncode
          except subprocess.TimeoutExpired:
              code = 'timeout'
          if code != 0:
              log = home / 'desktop.log'
              print(log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'No desktop.log was written.')
              sys.exit(f'Packaged smoke test failed: {code}')
      - uses: actions/upload-artifact@v4
        with:
          name: VocabStudy-Windows
          path: dist/VocabStudy-Windows.zip
          if-no-files-found: error
