[project]
name = "vocab-study"
version = "0.2.0"
description = "Desktop study workspace with vocabulary, Markdown notes, document readers, and spaced repetition."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Optional feature groups. Sizes shown to the user before install (see `dict install`).
wordnet = ["nltk>=3.8"]              # offline dictionary (~40 MB corpus download)
repl = ["prompt_toolkit>=3.0"]       # history + tab-completion for power users
embeddings = ["sentence-transformers>=2.2"]  # phase-2 semantic judge (~250 MB via torch)
test = ["pytest>=8,<10"]
desktop-build = ["PySide6>=6.8,<7", "nltk>=3.9,<4", "pyinstaller>=6.20,<7"]
gui = ["PySide6>=6.8,<7"]               # standalone desktop app (Qt); ~100 MB

[project.scripts]
vocab = "vocab.__main__:main"

[project.gui-scripts]
vocab-gui = "vocab.gui.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vocab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
